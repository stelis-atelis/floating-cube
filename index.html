
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Playground</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #dededb;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #navigation {
      position: fixed;
      z-index: 10;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px;
      border: 1px solid rgba(40, 40, 40, 0.12);
      border-radius: 30px;
      background: rgba(250, 250, 248, 0.82);
      backdrop-filter: blur(12px);
    }

    #navigation button {
      border: 0;
      border-radius: 24px;
      padding: 10px 15px;
      background: transparent;
      color: #555550;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }

    #navigation button.active {
      background: #333330;
      color: white;
    }

    .hint {
      position: fixed;
      z-index: 5;
      bottom: 25px;
      left: 0;
      width: 100%;
      text-align: center;
      color: #62625f;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      pointer-events: none;
      user-select: none;
    }

    @media (max-width: 480px) {
      #navigation { top: 12px; }
      #navigation button {
        padding: 9px 11px;
        font-size: 11px;
      }
      .hint { bottom: 16px; font-size: 10px; }
    }
  </style>
</head>

<body>
  <nav id="navigation" aria-label="Choose a 3D scene">
    <button class="active" data-scene="0">01 · Cube</button>
    <button data-scene="1">02 · Folded Form</button>
  </nav>

  <div class="hint">Click and drag to explore</div>

  <script type="module">
    import * as THREE from
      'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

    // --------------------------------------------------
    // SHARED RENDERER
    // --------------------------------------------------

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    document.body.appendChild(renderer.domElement);

    // Each scene has its own world, camera, object and particles.
    const scenes = [];

    // --------------------------------------------------
    // PARTICLE FIELD
    // --------------------------------------------------

    function createParticles(scene, count, color, spread) {
      const positions = new Float32Array(count * 3);
      const particles = [];

      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const radius = 2 + Math.random() * spread;
        const y = (Math.random() - 0.5) * spread * 1.2;

        particles.push({
          angle,
          radius,
          y,
          speed: 0.035 + Math.random() * 0.10,
          phase: Math.random() * Math.PI * 2
        });

        positions[i * 3] = Math.cos(angle) * radius;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = Math.sin(angle) * radius;
      }

      // Make a round particle texture.
      const particleCanvas = document.createElement('canvas');
      particleCanvas.width = 64;
      particleCanvas.height = 64;

      const context = particleCanvas.getContext('2d');
      context.beginPath();
      context.arc(32, 32, 28, 0, Math.PI * 2);
      context.fillStyle = '#ffffff';
      context.fill();

      const texture = new THREE.CanvasTexture(particleCanvas);

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute(
        'position',
        new THREE.BufferAttribute(positions, 3)
      );

      const material = new THREE.PointsMaterial({
        color,
        size: 0.018,
        map: texture,
        transparent: true,
        opacity: 0.7,
        alphaTest: 0.1,
        sizeAttenuation: true,
        depthWrite: false
      });

      const field = new THREE.Points(geometry, material);
      scene.add(field);

      return {
        field,
        geometry,
        particles,
        count
      };
    }

    // --------------------------------------------------
    // SCENE 1: ORIGINAL-STYLE COLOURFUL CUBE
    // --------------------------------------------------

    function createCubeScene() {
      const scene = new THREE.Scene();
      scene.background = new THREE.Color('#dededb');
      scene.fog = new THREE.Fog('#dededb', 9, 24);

      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        100
      );
      camera.position.set(0, 0, 8);

      scene.add(new THREE.HemisphereLight(0xffffff, 0x858580, 2.1));

      const light = new THREE.DirectionalLight(0xffffff, 3);
      light.position.set(-3, 5, 7);
      scene.add(light);

      const geometry = new THREE.BoxGeometry(1.65, 1.65, 1.65);

      const colors = [
        '#e84b3c',
        '#2c78d4',
        '#f0c844',
        '#35a86b',
        '#f08a35',
        '#9b69cc'
      ];

      const materials = colors.map(color =>
        new THREE.MeshStandardMaterial({
          color,
          roughness: 0.72,
          metalness: 0
        })
      );

      const object = new THREE.Mesh(geometry, materials);
      scene.add(object);

      const edges = new THREE.LineSegments(
        new THREE.EdgesGeometry(geometry),
        new THREE.LineBasicMaterial({
          color: 0x353535,
          transparent: true,
          opacity: 0.22
        })
      );
      object.add(edges);

      const particleData = createParticles(
        scene, 1800, 0x30302e, 7.5
      );

      return {
        scene,
        camera,
        object,
        particleData,
        idleYaw: 0.16,
        idlePitch: 0.035,
        lastInteraction: performance.now()
      };
    }

    // --------------------------------------------------
    // SCENE 2: CUSTOM FOLDED GEOMETRIC FORM
    // --------------------------------------------------

    function createFoldedScene() {
      const scene = new THREE.Scene();
      scene.background = new THREE.Color('#e7e5e0');
      scene.fog = new THREE.Fog('#e7e5e0', 12, 30);

      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        100
      );
      camera.position.set(0, 0, 9);

      scene.add(new THREE.HemisphereLight(0xffffff, 0x777777, 2.1));

      const light = new THREE.DirectionalLight(0xffffff, 2.8);
      light.position.set(-3, 5, 7);
      scene.add(light);

      // Vertex coordinates: [left/right, height, depth].
      const vertices = [
        [-2.5, -0.8,  0.7], // 0: front bottom left
        [ 2.5, -0.8,  0.7], // 1: front bottom right
        [ 2.5,  0.8,  0.7], // 2: front top right
        [-2.5,  0.8,  0.7], // 3: front top left
        [-2.5, -0.8, -0.7], // 4: rear bottom left
        [ 2.5, -0.8, -0.7], // 5: rear bottom right
        [ 2.5,  0.8, -0.7], // 6: rear top right
        [-2.5,  0.8, -0.7], // 7: rear top left
        [ 1.6,  1.55, -0.7] // 8: raised fold
      ];

      // Each polygon has its own material number.
      const faces = [
        { points: [0, 1, 2, 3], material: 0 }, // front
        { points: [5, 4, 7, 6], material: 1 }, // rear
        { points: [4, 0, 3, 7], material: 2 }, // left
        { points: [1, 5, 6, 2], material: 3 }, // right
        { points: [4, 5, 1, 0], material: 4 }, // bottom
        { points: [7, 8, 3], material: 5 },    // fold panel
        { points: [8, 2, 3], material: 6 },    // upper panel
        { points: [7, 6, 8], material: 7 },    // rear fold
        { points: [6, 2, 8], material: 8 }     // top fold
      ];

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute(
        'position',
        new THREE.Float32BufferAttribute(vertices.flat(), 3)
      );

      const indices = [];
      const groups = [];

      for (const face of faces) {
        const start = indices.length;
        const p = face.points;

        for (let i = 1; i < p.length - 1; i++) {
          indices.push(p[0], p[i], p[i + 1]);
        }

        groups.push({
          start,
          count: indices.length - start,
          material: face.material
        });
      }

      geometry.setIndex(indices);

      for (const group of groups) {
        geometry.addGroup(
          group.start,
          group.count,
          group.material
        );
      }

      geometry.computeVertexNormals();

      const colors = [
        '#5968ad', // front blue
        '#7657a8', // rear purple
        '#35a86b', // left green
        '#ed873b', // right orange
        '#e8c94b', // bottom yellow
        '#e84b3c', // fold red
        '#5968ad', // upper blue
        '#30302e', // rear dark grey
        '#f08a35'  // upper orange
      ];

      const materials = colors.map(color =>
        new THREE.MeshStandardMaterial({
          color,
          roughness: 0.8,
          metalness: 0,
          side: THREE.DoubleSide,
          flatShading: true
        })
      );

      const object = new THREE.Mesh(geometry, materials);
      scene.add(object);

      const edges = new THREE.LineSegments(
        new THREE.EdgesGeometry(geometry, 1),
        new THREE.LineBasicMaterial({
          color: 0x252525,
          transparent: true,
          opacity: 0.35
        })
      );
      object.add(edges);

      const particleData = createParticles(
        scene, 1200, 0x35332f, 9
      );

      return {
        scene,
        camera,
        object,
        particleData,
        idleYaw: 0.10,
        idlePitch: 0.025,
        lastInteraction: performance.now()
      };
    }

    // Create both scenes without mixing their contents.
    scenes.push(createCubeScene());
    scenes.push(createFoldedScene());

    // --------------------------------------------------
    // SCENE NAVIGATION
    // --------------------------------------------------

    let activeSceneIndex = 0;

    const navigationButtons = document.querySelectorAll(
      '#navigation button'
    );

    function switchScene(index) {
      activeSceneIndex = index;

      navigationButtons.forEach((button, i) => {
        button.classList.toggle('active', i === index);
      });

      document.querySelector('.hint').textContent =
        index === 0
          ? 'Click and drag to explore'
          : 'Click and drag to explore the folded form';

      // Prevent the previous scene's drag momentum from carrying over.
      scenes[index].lastInteraction = performance.now();
    }

    navigationButtons.forEach(button => {
      button.addEventListener('click', () => {
        switchScene(Number(button.dataset.scene));
      });
    });

    // --------------------------------------------------
    // DRAG ROTATION AND MOMENTUM
    // --------------------------------------------------

    let dragging = false;
    let previousX = 0;
    let previousY = 0;
    let velocityYaw = 0;
    let velocityPitch = 0;

    function rotateObject(object, yaw, pitch) {
      const yawRotation = new THREE.Quaternion()
        .setFromAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

      const pitchRotation = new THREE.Quaternion()
        .setFromAxisAngle(new THREE.Vector3(1, 0, 0), pitch);

      object.quaternion.premultiply(yawRotation);
      object.quaternion.premultiply(pitchRotation);
    }

    renderer.domElement.addEventListener('pointerdown', event => {
      dragging = true;
      previousX = event.clientX;
      previousY = event.clientY;
      velocityYaw = 0;
      velocityPitch = 0;

      scenes[activeSceneIndex].lastInteraction = performance.now();

      renderer.domElement.setPointerCapture(event.pointerId);
    });

    renderer.domElement.addEventListener('pointermove', event => {
      if (!dragging) return;

      const dx = event.clientX - previousX;
      const dy = event.clientY - previousY;

      velocityYaw = dx * 0.006;
      velocityPitch = dy * 0.006;

      const object = scenes[activeSceneIndex].object;
      rotateObject(object, velocityYaw, velocityPitch);

      previousX = event.clientX;
      previousY = event.clientY;

      scenes[activeSceneIndex].lastInteraction = performance.now();
    });

    function stopDragging() {
      dragging = false;
    }

    renderer.domElement.addEventListener('pointerup', stopDragging);
    renderer.domElement.addEventListener('pointercancel', stopDragging);

    // --------------------------------------------------
    // ANIMATION
    // --------------------------------------------------

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = Math.min(clock.getDelta(), 0.05);
      const time = clock.elapsedTime;

      // Animate both particle fields, but render only the selected scene.
      for (const state of scenes) {
        const data = state.particleData;
        const positions = data.geometry.attributes.position.array;

        for (let i = 0; i < data.count; i++) {
          const p = data.particles[i];
          p.angle += p.speed * delta;

          positions[i * 3] = Math.cos(p.angle) * p.radius;
          positions[i * 3 + 1] =
            p.y + Math.sin(time * 0.28 + p.phase) * 0.32;
          positions[i * 3 + 2] = Math.sin(p.angle) * p.radius;
        }

        data.geometry.attributes.position.needsUpdate = true;
        data.field.rotation.y = Math.sin(time * 0.07) * 0.12;
      }

      const active = scenes[activeSceneIndex];

      if (!dragging) {
        if (performance.now() - active.lastInteraction > 1800) {
          rotateObject(
            active.object,
            active.idleYaw * delta,
            active.idlePitch * delta
          );
        } else {
          rotateObject(
            active.object,
            velocityYaw,
            velocityPitch
          );
        }

        velocityYaw *= 0.96;
        velocityPitch *= 0.96;
      }

      renderer.render(active.scene, active.camera);
    }

    animate();

    // --------------------------------------------------
    // RESPONSIVE RESIZING
    // --------------------------------------------------

    window.addEventListener('resize', () => {
      for (const state of scenes) {
        state.camera.aspect =
          window.innerWidth / window.innerHeight;
        state.camera.updateProjectionMatrix();
      }

      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
  </script>
</body>
</html>
