
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Floating Cube</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #dededb;
    }

    body {
      font-family: sans-serif;
      cursor: grab;
    }

    body:active { cursor: grabbing; }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .hint {
      position: fixed;
      bottom: 26px;
      left: 0;
      width: 100%;
      text-align: center;
      color: #62625f;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <div class="hint">Click and drag to explore</div>

  <script type="module">
    import * as THREE from
      'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

    // Scene and camera
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#dededb');
    scene.fog = new THREE.Fog('#dededb', 9, 24);

    const camera = new THREE.PerspectiveCamera(
      45, window.innerWidth / window.innerHeight, 0.1, 100
    );
    camera.position.set(0, 0, 8);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    document.body.appendChild(renderer.domElement);

    // Soft lighting
    scene.add(new THREE.HemisphereLight(0xffffff, 0x858580, 2.1));

    const light = new THREE.DirectionalLight(0xffffff, 3);
    light.position.set(-3, 5, 7);
    scene.add(light);

    // The cube: one different colour per face
    const cubeGeometry = new THREE.BoxGeometry(1.65, 1.65, 1.65);
    const colors = [
      '#e84b3c', // right
      '#2c78d4', // left
      '#f0c844', // top
      '#35a86b', // bottom
      '#f08a35', // front
      '#9b69cc'  // back
    ];

    const cubeMaterials = colors.map(color =>
      new THREE.MeshStandardMaterial({
        color,
        roughness: 0.72,
        metalness: 0
      })
    );

    const cube = new THREE.Mesh(cubeGeometry, cubeMaterials);
    cube.scale.setScalar(2.1);
    scene.add(cube);

    // Very subtle edges to keep the geometry crisp
    const edges = new THREE.LineSegments(
      new THREE.EdgesGeometry(cubeGeometry),
      new THREE.LineBasicMaterial({
        color: 0x353535,
        transparent: true,
        opacity: 0.22
      })
    );
    cube.add(edges);

    // Flowing dark particles
    const particleCount = 4000;
    const positions = new Float32Array(particleCount * 3);
    const particles = [];

    for (let i = 0; i < particleCount; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = 2.0 + Math.random() * 7.5;
      const y = (Math.random() - 0.5) * 9;

      particles.push({
        angle,
        radius,
        y,
        speed: 0.035 + Math.random() * 0.10,
        phase: Math.random() * Math.PI * 2,
        size: 0.5 + Math.random() * 1.5
      });

      positions[i * 3] = Math.cos(angle) * radius;
      positions[i * 3 + 1] = y;
      positions[i * 3 + 2] = Math.sin(angle) * radius;
    }

    const particleGeometry = new THREE.BufferGeometry();
    particleGeometry.setAttribute(
      'position',
      new THREE.BufferAttribute(positions, 3)
    );

   
    // Create a small, circular particle texture
    const particleCanvas = document.createElement('canvas');
    particleCanvas.width = 64;
    particleCanvas.height = 64;

    const particleContext = particleCanvas.getContext('2d');
    particleContext.beginPath();
    particleContext.arc(32, 32, 28, 0, Math.PI * 2);
    particleContext.fillStyle = '#ffffff';
    particleContext.fill();

    const particleTexture = new THREE.CanvasTexture(particleCanvas);

    const particleMaterial = new THREE.PointsMaterial({
      color: 0x30302e,
      size: 0.05,
      map: particleTexture,
      transparent: true,
      opacity: 0.9,
      alphaTest: 0.1,
      sizeAttenuation: true,
      depthWrite: false
    });


    const particleField = new THREE.Points(
      particleGeometry, particleMaterial
    );
    scene.add(particleField);
   
    // Dragging and rotational momentum
    let dragging = false;
    let previousX = 0;
    let previousY = 0;
    let velocityYaw = 0;
    let velocityPitch = 0;
    let lastInteraction = performance.now();

    // Rotate relative to the camera's screen directions
    function rotateCube(yaw, pitch) {
      const cameraUp = new THREE.Vector3(0, 1, 0)
        .applyQuaternion(camera.quaternion);

      const cameraRight = new THREE.Vector3(1, 0, 0)
        .applyQuaternion(camera.quaternion);

      const yawRotation = new THREE.Quaternion()
        .setFromAxisAngle(cameraUp, yaw);

      const pitchRotation = new THREE.Quaternion()
        .setFromAxisAngle(cameraRight, pitch);

      cube.quaternion.premultiply(yawRotation);
      cube.quaternion.premultiply(pitchRotation);
    }

    renderer.domElement.addEventListener('pointerdown', event => {
      dragging = true;
      previousX = event.clientX;
      previousY = event.clientY;
      velocityYaw = 0;
      velocityPitch = 0;
      lastInteraction = performance.now();

      renderer.domElement.setPointerCapture(event.pointerId);
    });

    renderer.domElement.addEventListener('pointermove', event => {
      if (!dragging) return;

      const dx = event.clientX - previousX;
      const dy = event.clientY - previousY;

      velocityYaw = dx * 0.006;
      velocityPitch = dy * 0.006;

      rotateCube(velocityYaw, velocityPitch);

      previousX = event.clientX;
      previousY = event.clientY;
      lastInteraction = performance.now();
    });

    function stopDragging() {
      dragging = false;
      lastInteraction = performance.now();
    }

    renderer.domElement.addEventListener('pointerup', stopDragging);
    renderer.domElement.addEventListener('pointercancel', stopDragging);

    // Animation
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const time = clock.getElapsedTime();
      const delta = Math.min(clock.getDelta(), 0.05);

      // A gentle idle rotation, plus momentum after releasing
        if (!dragging) {
        if (performance.now() - lastInteraction > 1800) {
          rotateCube(0.16 * delta, 0.035 * delta);
        } else {
          rotateCube(velocityYaw, velocityPitch);
        }

        velocityYaw *= 0.96;
        velocityPitch *= 0.96;
      }
      // Particles flow along broad, curved paths
      const positions = particleGeometry.attributes.position.array;

      for (let i = 0; i < particleCount; i++) {
        const p = particles[i];
        p.angle += p.speed * delta;

        positions[i * 3] =
          Math.cos(p.angle) * p.radius;

        positions[i * 3 + 1] =
          p.y + Math.sin(time * 0.28 + p.phase) * 0.32;

        positions[i * 3 + 2] =
          Math.sin(p.angle) * p.radius;
      }

      particleGeometry.attributes.position.needsUpdate = true;
      particleField.rotation.y = Math.sin(time * 0.07) * 0.12;

      renderer.render(scene, camera);
    }

    animate();

    // Adapt to window size and device orientation
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
  </script>
</body>
</html>
